<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandala Coloring Pages</title>
<style>
  /* ---------- Screen layout ---------- */
  body {
    margin: 0;
    font-family: -apple-system, system-ui, sans-serif;
    background: #e9e6df;
    color: #222;
  }
  .controls {
    position: sticky;
    top: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: center;
    padding: 10px 12px;
    background: #fffdf7;
    border-bottom: 1px solid #cfc9b8;
  }
  .controls label { font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .controls input, .controls select {
    padding: 8px;
    min-height: 44px;  /* comfortable to tap on a tablet */
    font-size: 16px;   /* 16px stops iPhone from zooming in on focus */
    box-sizing: border-box;
  }
  .controls input { width: 100px; }
  .controls button {
    padding: 8px 16px;
    min-height: 44px;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #8a836f;
    background: #f5f1e6;
  }
  .controls button.primary { background: #2f6f4e; color: white; border-color: #2f6f4e; }
  .status { max-width: 850px; margin: 16px auto; padding: 0 12px; font-size: 16px; }
  .status.error { color: #8a1f1f; }
  .page {
    display: block;
    width: 100%;
    max-width: 850px;
    height: auto;
    margin: 16px auto;
    background: white;
    box-shadow: 0 2px 12px rgba(0,0,0,.25);
  }

  /* ---------- Print layout ----------
     The SVG is drawn in "page units" where 100 units = 1 inch, so the
     850 x 1100 drawing is exactly US Letter. On paper we hide the
     controls and size the SVG to the sheet. */
  @page { size: letter portrait; margin: 0; }
  @media print {
    body { background: white; }
    .controls { display: none; }
    .page { width: 8.5in; height: 11in; margin: 0; box-shadow: none; }
  }
</style>
</head>
<body>

<div class="controls">
  <button class="primary" id="regen">Regenerate</button>
  <label>Animal
    <select id="subject">
      <option value="giraffe">Giraffe</option>
      <option value="horse">Horse</option>
    </select>
  </label>
  <label>Detail
    <select id="detail">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>
  </label>
  <label>Seed <input id="seed" type="number" inputmode="numeric"></label>
  <button id="print">Print</button>
</div>

<!-- Shown while the script loads. If the script fails (for example on a
     browser too old to run it) this turns into an error message, which is
     the quickest way to tell whether a device can run the generator. -->
<p class="status" id="status">Loading the generator…</p>

<!-- The drawing goes here. viewBox = the coordinate system we draw in. -->
<svg class="page" id="page" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1100"></svg>

<!-- This tiny script is deliberately old-fashioned JavaScript so that it
     runs even on browsers that choke on the generator. -->
<script>
window.onerror = function (message) {
  var status = document.getElementById('status');
  status.hidden = false;
  status.className = 'status error';
  status.textContent = 'This browser could not run the generator. ' +
    'It is probably too old; try updating Chrome. The error was: ' + message;
};
</script>
<script src="generator.js"></script>
<script>
'use strict';

/* =====================================================================
   Controls
   The settings live in the page address (#subject=horse&detail=high&seed=123)
   so a page can be bookmarked or shared and comes back identical.
   ===================================================================== */
const inputs = {
  subject: document.getElementById('subject'),
  detail:  document.getElementById('detail'),
  seed:    document.getElementById('seed'),
};
const randomSeed = () => Math.floor(Math.random() * 1000000);

function readSettingsFromUrl() {
  const p = new URLSearchParams(location.hash.slice(1));
  return {
    subject: ANIMALS[p.get('subject')] ? p.get('subject') : 'giraffe',
    detail:  DETAIL[p.get('detail')] ? p.get('detail') : 'medium',
    seed:    /^\d+$/.test(p.get('seed') || '') ? Number(p.get('seed')) : randomSeed(),
  };
}
function currentSettings() {
  return {
    subject: inputs.subject.value,
    detail:  inputs.detail.value,
    seed:    Number(inputs.seed.value) || 0,
  };
}
function apply(settings) {
  inputs.subject.value = settings.subject;
  inputs.detail.value = settings.detail;
  inputs.seed.value = settings.seed;
  history.replaceState(null, '', `#subject=${settings.subject}&detail=${settings.detail}&seed=${settings.seed}`);
  render(document.getElementById('page'), settings);
  document.getElementById('status').hidden = true;
}

document.getElementById('regen').addEventListener('click', () => apply(Object.assign(currentSettings(), { seed: randomSeed() })));
document.getElementById('print').addEventListener('click', () => window.print());
for (const input of Object.values(inputs)) input.addEventListener('change', () => apply(currentSettings()));

apply(readSettingsFromUrl());
</script>
</body>
</html>
